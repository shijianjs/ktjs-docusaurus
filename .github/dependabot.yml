version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # IntelliJ IDEA 2026.2.3 fails to sync with Gradle 9.8.x
      # (ExternalSystemPartialResolutionException with an empty message).
      # Keep the wrapper on the last version that syncs until the IDE is fixed.
      - dependency-name: "gradle-wrapper"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      kotlin-wrappers:
        patterns:
          - "org.jetbrains.kotlin-wrappers*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      # Docusaurus publishes every package in lockstep, so they must move in one PR: a wrapper that
      # pins core at one version and preset-classic at another installs two incompatible copies.
      docusaurus:
        patterns:
          - "@docusaurus/*"
      # The Prism themes come from a different package with its own release cadence.
      prism:
        patterns:
          - "prism-react-renderer"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
