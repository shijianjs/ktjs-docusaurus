kotlin.js.yarn=false

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# The DOM helpers every element on this site is built on. They have a repository of their own
# (shijianjs/ktjs-dom-kit) and a hand-written semantic version; `mavenLocal` in settings.gradle.kts
# resolves a SNAPSHOT published from that checkout.
ktjs-dom-kit.version=0.1.0
